[package]
name = "many-lamps-data-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror.workspace = true

# Logging
log = "0.4"

# Arrow/Parquet for columnar storage
arrow = { version = "52.0", features = ["json"] }
parquet = { version = "52.0", features = ["arrow"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Workspace crates
many-lamps-core = { path = "../core" }
mtrader-ml = { path = "../ml" }
mtrader-recorder = { path = "../recorder" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3.8"
rand = "0.8"
