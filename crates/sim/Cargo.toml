[package]
name = "mtrader-sim"
version = "0.1.0"
edition = "2021"
description = "Paper trading simulator for Polymarket"

[dependencies]
mtrader-core = { package = "many-lamps-core", path = "../core" }
mtrader-book = { package = "many-lamps-book", path = "../book" }
mtrader-execution = { path = "../execution" }
mtrader-risk = { path = "../risk" }
mtrader-strategy = { path = "../strategy" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Utilities
thiserror = { workspace = true }
tracing = { workspace = true }

# Random for fill simulation
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
