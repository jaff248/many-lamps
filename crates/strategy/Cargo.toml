[package]
name = "mtrader-strategy"
version = "0.1.0"
edition = "2021"
description = "Trading strategies for Polymarket"

[dependencies]
mtrader-core = { package = "many-lamps-core", path = "../core" }
mtrader-book = { package = "many-lamps-book", path = "../book" }
mtrader-execution = { path = "../execution" }
mtrader-risk = { path = "../risk" }
mtrader-research = { path = "../research" }
mtrader-ml = { path = "../ml", features = ["ml"] }

# Async runtime
tokio = { workspace = true }

# Time
chrono = { workspace = true }

# Serialization
serde = { workspace = true }

# Utilities
thiserror = { workspace = true }
tracing = { workspace = true }

