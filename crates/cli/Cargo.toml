[package]
name = "mtrader-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for MTrader Polymarket trading system"

[[bin]]
name = "mtrader"
path = "src/main.rs"

[dependencies]
mtrader-core = { package = "many-lamps-core", path = "../core" }
mtrader-book = { package = "many-lamps-book", path = "../book" }
mtrader-gateway = { package = "many-lamps-gateway", path = "../gateway" }
mtrader-execution = { path = "../execution" }
mtrader-risk = { path = "../risk" }
mtrader-strategy = { path = "../strategy" }
mtrader-sim = { path = "../sim" }
mtrader-recorder = { path = "../recorder" }
mtrader-dashboard = { path = "../dashboard" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Config
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
