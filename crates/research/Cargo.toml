[package]
name = "mtrader-research"
version = "0.1.0"
edition = "2021"
description = "On-chain research and data collection for Polymarket analysis"

[dependencies]
# Web3 and blockchain interaction
ethers = { version = "2.0", features = ["ethers-solc"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
thiserror = "1.0"

[dev-dependencies]
console = "0.15"
