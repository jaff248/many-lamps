[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/book",
    "crates/gateway",
    "crates/strategy",
    "crates/execution",
    "crates/risk",
    "crates/recorder",
    "crates/sim",
    "crates/cli",
    "crates/dashboard",
    "crates/research",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Many Lamps Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Crypto
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"

# Data storage
parquet = { version = "53", features = ["async"] }
arrow = "53"

# Channels
crossbeam-channel = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# Testing
proptest = "1.5"
criterion = "0.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
config = "0.14"
